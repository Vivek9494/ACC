packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  '@react-navigation/native': '7.2.5'
  '@react-navigation/core': '7.17.5'

allowBuilds:
  '@firebase/util': set this to true or false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  dtrace-provider: true
  msgpackr-extract: false
  prisma: true
  protobufjs: set this to true or false
  unrs-resolver: false
