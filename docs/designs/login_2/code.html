<!DOCTYPE html>

<html lang="en"><head>

        .bg-mesh {
            background-color: #f9f9fc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 107, 0, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 214, 0, 0.1) 0px, transparent 50%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#351000",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#fdd400",
                        "background": "#f9f9fc",
                        "secondary-fixed": "#ffe170",
                        "surface-container-highest": "#e2e2e5",
                        "surface-bright": "#f9f9fc",
                        "tertiary-fixed": "#d0e4ff",
                        "surface": "#f9f9fc",
                        "surface-container-low": "#f3f3f6",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#ffb693",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#003357",
                        "primary": "#a04100",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#e9c400",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e8e8ea",
                        "outline-variant": "#e2bfb0",
                        "inverse-surface": "#2f3133",
                        "on-surface-variant": "#5a4136",
                        "on-secondary-fixed-variant": "#544600",
                        "primary-container": "#ff6b00",
                        "on-background": "#1a1c1e",
                        "on-tertiary-fixed-variant": "#00497b",
                        "surface-container": "#eeeef0",
                        "outline": "#8e7164",
                        "tertiary-fixed-dim": "#9ccaff",
                        "secondary": "#705d00",
                        "primary-fixed-dim": "#ffb693",
                        "on-secondary-fixed": "#221b00",
                        "inverse-on-surface": "#f0f0f3",
                        "primary-fixed": "#ffdbcc",
                        "on-primary-container": "#572000",
                        "tertiary": "#0062a1",
                        "error": "#ba1a1a",
                        "surface-variant": "#e2e2e5",
                        "surface-dim": "#dadadc",
                        "on-surface": "#1a1c1e",
                        "on-error": "#ffffff",
                        "surface-tint": "#a04100",

                        "on-secondary-container": "#6f5c00",
                        "on-primary-fixed-variant": "#7a3000",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",

                    },
                    "spacing": {
                        "lg": "40px",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-mesh min-h-screen flex flex-col items-center justify-center p-margin-mobile overflow-x-hidden">
<!-- Hero Section / Branding -->
<div class="w-full max-w-md flex flex-col items-center mb-10">
<div class="relative w-24 h-24 mb-6">
<div class="absolute inset-0 bg-primary-container rounded-full opacity-20 animate-pulse"></div>
<div class="relative flex items-center justify-center w-full h-full bg-white rounded-full shadow-lg border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">sports_cricket</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface text-center mb-1">Hariprabodham</h1>
<p class="font-label-md text-label-md text-on-surface-variant tracking-widest">SPORTS CLUB</p>
</div>
<!-- Glassmorphism Login Form -->
<div class="w-full max-w-md glass-container rounded-[32px] p-8 shadow-2xl relative overflow-hidden">
<!-- Background decorative blur -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-secondary-container/20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-10 -left-10 w-32 h-32 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="relative z-10">
<!-- Spiritual Greeting -->
<div class="text-center mb-8">
<h2 class="font-headline-md text-headline-md text-primary-container drop-shadow-sm">Jay Swaminarayan</h2>
<div class="h-1 w-12 bg-primary-container/30 mx-auto mt-2 rounded-full"></div>
</div>
<form class="space-y-6">
<!-- Mobile Number Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="mobile">Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-[20px]">phone_iphone</span>
<input class="w-full h-14 pl-12 pr-4 bg-white/50 border border-outline-variant rounded-2xl font-body-md text-body-md focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none placeholder:text-on-surface-variant/40" id="mobile" placeholder="Enter 10 digit number" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-[20px]">lock_open</span>
<input class="w-full h-14 pl-12 pr-12 bg-white/50 border border-outline-variant rounded-2xl font-body-md text-body-md focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none placeholder:text-on-surface-variant/40" id="password" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-14 bg-primary-container text-white font-headline-md text-headline-md rounded-2xl shadow-[0px_8px_20px_rgba(255,107,0,0.3)] active:scale-95 transition-all flex items-center justify-center gap-2 hover:bg-primary transition-colors" type="submit">
                    Sign In
                    <span class="material-symbols-outlined">login</span>
</button>
<!-- Forgot Password -->
<div class="text-center">
<a class="font-label-md text-label-md text-primary-container hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
</form>
</div>
</div>
<!-- Signup Footer -->
<div class="mt-12 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
            New to Hariprabodham Sports Club?
            <a class="font-label-md text-label-md text-primary-container ml-1 hover:underline underline-offset-4 decoration-2" href="#">Sign Up</a>
</p>
</div>
<!-- Bottom Illustration (Subtle) -->
<div class="fixed bottom-0 left-0 w-full overflow-hidden h-32 pointer-events-none opacity-10">
<div class="flex justify-around items-end h-full">
<span class="material-symbols-outlined text-[120px]">sports_cricket</span>
<span class="material-symbols-outlined text-[100px]">sports_soccer</span>
<span class="material-symbols-outlined text-[140px]">sports_volleyball</span>
<span class="material-symbols-outlined text-[110px]">sports_kabaddi</span>
</div>
</div>
<script>
        // Simple micro-interaction for password toggle
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        const eyeIcon = toggleBtn ? toggleBtn.querySelector('span') : null;

        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                eyeIcon.textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }

        // Form Submission visual feedback
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                alert('Authentication service simulated. Mobile login flow active.');
            }, 1500);
        });
    </script>
</body></html>
