<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Match Card - Solar Minimalism</title>
<!-- Load Tailwind CSS v3 with relevant plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Load Plus Jakarta Sans font as specified in Design System -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols for the chevron icon -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary": "#ffffff",
            "tertiary-fixed": "#d0e4ff",
            "on-secondary": "#ffffff",
            "inverse-primary": "#ffb693",
            "secondary-container": "#fdd400",
            "on-tertiary-container": "#003357",
            "tertiary-fixed-dim": "#9ccaff",
            "surface-tint": "#a04100",
            "surface-container-highest": "#e2e2e5",
            "on-tertiary-fixed-variant": "#00497b",
            "on-tertiary-fixed": "#001d35",
            "inverse-on-surface": "#f0f0f3",
            "surface-container-high": "#e8e8ea",
            "surface-bright": "#f9f9fc",
            "on-surface": "#1a1c1e",
            "outline-variant": "#e2bfb0",
            "primary": "#a04100",
            "on-secondary-fixed-variant": "#544600",
            "primary-fixed": "#ffdbcc",
            "on-primary-container": "#572000",
            "tertiary-container": "#059eff",
            "on-primary-fixed-variant": "#7a3000",
            "error-container": "#ffdad6",
            "surface-container-lowest": "#ffffff",
            "secondary-fixed-dim": "#e9c400",
            "on-error": "#ffffff",
            "on-surface-variant": "#5a4136",
            "on-secondary-fixed": "#221b00",
            "on-error-container": "#93000a",
            "primary-fixed-dim": "#ffb693",
            "on-primary-fixed": "#351000",
            "surface-container-low": "#f3f3f6",
            "on-tertiary": "#ffffff",
            "tertiary": "#0062a1",
            "surface-dim": "#dadadc",
            "on-secondary-container": "#6f5c00",
            "inverse-surface": "#2f3133",
            "error": "#ba1a1a",
            "primary-container": "#ff6b00",
            "outline": "#8e7164",
            "surface-variant": "#e2e2e5",
            "on-background": "#1a1c1e",
            "background": "#f9f9fc",
            "surface-container": "#eeeef0",
            "secondary": "#705d00",
            "secondary-fixed": "#ffe170",
            "surface": "#f9f9fc"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px",
            "solar-8": "2rem"
          },
          "spacing": {
            "base": "8px",
            "sm": "12px",
            "margin-mobile": "16px",
            "xl": "64px",
            "gutter": "24px",
            "max-width": "1280px",
            "lg": "40px",
            "margin-desktop": "auto",
            "md": "24px",
            "xs": "4px"
          },
          "fontFamily": {
            "sans": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
<style data-purpose="layout-styling">
    body {
      background-color: #f9f9fc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    .solar-card-shadow {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-surface">
<!-- BEGIN: LiveMatchFocusScreen -->
<main class="w-full max-w-md" data-purpose="focused-match-container">
<!-- BEGIN: LiveMatchCard -->
<section class="bg-surface-container-lowest rounded-solar-8 p-6 relative overflow-hidden solar-card-shadow border-l-8 border-primary-container" data-purpose="live-match-card">
<!-- Card Header: Tournament and Live Badge -->
<div class="flex justify-between items-center mb-6">
<h2 class="text-on-surface font-bold text-lg">Inter-City Finals</h2>
<span class="flex items-center gap-1.5 bg-primary-container/10 text-primary-container px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest">
<span class="w-1.5 h-1.5 bg-primary-container rounded-full animate-pulse"></span>
        Live
      </span>
</div>
<!-- Match Scores Container (Three Column Layout) -->
<div class="grid grid-cols-3 items-center mb-8" data-purpose="score-section">
<!-- Team 1: Titans XI -->
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 bg-surface-container-low border border-outline-variant/30 rounded-xl flex items-center justify-center p-2 shadow-sm">
<img alt="Titans XI Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCO8G3gphg8uwyIzLrmDAto65Zy6DkfDIdgtYSyDZJUnRrQrd_-yw2ZdwTAyCHN4tsz4lJtTE92CTJT1hr89MqOIEy7za-VmPN_xO9kCuSJnjW-X8mp1taJkDYo5rw4RfBAYAoxyscdgV2KoUGzXHi9b_JCja_qKTVPLEso7QF_n9nyj2NC70zCvKX6m6O1HMg095tmxHskcHy1_vDYXL_70nNQ2zHTIsAOZ_axlE5Z-GSkKUs3OeXzaYKvhvDdH76LuwJ5krDGjnQk"/>
</div>
<span class="text-sm font-bold text-on-surface text-center leading-tight">Titans XI</span>
</div>
<!-- Center: Score and VS -->
<div class="flex flex-col items-center justify-center">
<div class="text-2xl font-extrabold text-primary-container tracking-tight">142/4</div>
<div class="text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-1">15.2 Overs</div>
<div class="px-2 py-0.5 rounded-full bg-surface-container text-[10px] font-extrabold text-on-surface-variant uppercase">vs</div>
</div>
<!-- Team 2: Lions CC -->
<div class="flex flex-col items-center gap-2">
<div class="w-14 h-14 bg-surface-container-low border border-outline-variant/30 rounded-xl flex items-center justify-center p-2 shadow-sm">
<img alt="Lions CC Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgdkyxXUr26f7CRdSP64htshMduHGCbcYT2JTtJ_T0GfvNhkIyz8is1OjnfzCkx4jhQBJ-blT7gNOKe97Hfbxm9PM_0JN1YAXAD-dbf2JJQxFdaVOKNdvyOJbfkHsufqsi4un-gQN6cP3Gag8prj0kGC6-6S1pJy1INgeWMYhZ90Gwnjc1xYpRyF9SFALclhCLXwnhv5xR4Zdh_M2VjYYbu6lQBXkQEvQfYbY6HGsXuza89pXRnle-Si0K-YADiYi8mB1BGFkHK-DK"/>
</div>
<span class="text-sm font-bold text-on-surface text-center leading-tight">Lions CC</span>
</div>
</div>
<!-- Horizontal Divider -->
<div class="h-px bg-outline-variant/20 w-full mb-4"></div>
<!-- Match Result Footer -->
<div class="flex justify-between items-center">
<div class="text-on-surface-variant font-semibold text-sm" data-purpose="match-result">
        Titans XI need 34 runs in 28 balls
      </div>
<a class="flex items-center gap-0.5 text-primary text-sm font-bold hover:opacity-80 transition-opacity" href="#">
        Schedule
        <span class="material-symbols-outlined text-base">chevron_right</span>
</a>
</div>
</section>
<!-- END: LiveMatchCard -->
</main>
<!-- END: LiveMatchFocusScreen -->
</body></html>
