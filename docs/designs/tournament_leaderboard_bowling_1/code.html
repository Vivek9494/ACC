<script>
        // Simple tab switching animation
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
                if(this.textContent.trim() === 'Bat' || this.textContent.trim() === 'Bowl') {
                    document.querySelectorAll('button').forEach(btn => {
                        btn.classList.remove('text-primary', 'border-b-2', 'border-primary');
                        btn.classList.add('text-on-surface-variant');
                    });
                    this.classList.remove('text-on-surface-variant');
                    this.classList.add('text-primary', 'border-b-2', 'border-primary');
                }
            });
        });

        // Add micro-interaction to cards
        const cards = document.querySelectorAll('.solar-shadow');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-2px)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0px)';
            });
        });
    </script>
