<script>
        // Simple interactive feedback for cards
        document.querySelectorAll('.card-shadow').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.transform = 'scale(0.98)';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Tab switching logic (Visual only)
        const tabs = document.querySelectorAll('.font-label-md');
        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                // This is a simple visual toggle
                if (!e.currentTarget.classList.contains('text-primary')) {
                    console.log('Switching tabs...');
                }
            });
        });
