<!-- Header Text -->
<div class="text-center space-y-2">
<h2 class="font-headline-xl text-headline-xl text-primary text-center mb-2">Change Password</h2><h2 class="font-headline-lg text-headline-lg text-on-surface">Security Update</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ensure your account stays secure with a strong password.</p>
</div>
<!-- Form -->
<form class="space-y-6" id="changePasswordForm">
<!-- Current Password -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="current-password">Current Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-body-md placeholder:text-outline-variant/60" id="current-password" name="current-password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('current-password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- New Password -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="new-password">New Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-body-md placeholder:text-outline-variant/60" id="new-password" name="new-password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('new-password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<p class="text-label-sm font-label-sm text-outline-variant px-1 italic">Must be at least 8 characters long</p>
</div>

<label class="font-label-md text-label-md text-on-surface-variant px-1" for="confirm-password">Confirm Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200 font-body-md text-body-md placeholder:text-outline-variant/60" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" onclick="togglePassword('confirm-password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>

                        Update Password

</a>

<script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const btn = input.nextElementSibling.querySelector('span');
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "visibility_off";
            } else {
                input.type = "password";
                btn.innerText = "visibility";
            }
        }

        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Micro-interaction: Simulate loading
            const btn = this.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Updating...';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Success!';
                btn.classList.replace('bg-primary-container', 'bg-tertiary-container');
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary-container', 'bg-primary-container');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
