<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f4f8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top AppBar - Following JSON structure -->
<header class="flex justify-between items-center w-full px-4 h-16 bg-surface border-b border-outline-variant sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-200" data-icon="arrow_back">
                arrow_back
            </button>
<h1 class="text-headline-md font-headline-md text-primary">Reset Password</h1>
</div>
<div>
<!-- Placeholder for Trailing Avatar as per JSON structure, though not used in this specific layout -->
<div class="w-10 h-10 rounded-full bg-surface-container-high hidden"></div>
</div>
</header>
<main class="flex-1 flex items-center justify-center w-full max-w-max-width px-margin-mobile md:px-margin-desktop py-xl">
<div class="w-full max-w-md">
<!-- Content Header -->
<div class="text-center mb-lg">
<div class="mb-6 flex justify-center">
<div class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
</div>
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-2">Create New Password</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Your new password must be different from previous used passwords.</p>
</div>
<!-- Form Fields - Solar Minimalism Style -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface ml-1" for="new-password">New Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" id="new-password" placeholder="Enter your new password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="text-label-md font-label-md text-on-surface ml-1" for="confirm-password">Confirm Password</label>
<div class="relative group">
<input class="w-full h-14 px-4 bg-white border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-primary-container outline-none transition-all text-on-surface placeholder:text-on-surface-variant/50" id="confirm-password" placeholder="Re-enter your new password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Password Requirements List -->
<div class="py-2 space-y-2">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-label-sm font-label-sm">At least 8 characters long</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">circle</span>
<span class="text-label-sm font-label-sm">Must include a special character</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary-container text-white text-headline-md font-headline-md rounded-lg shadow-md hover:bg-primary transition-all active:scale-[0.98] focus:ring-4 focus:ring-primary-fixed" type="submit">
                    Set New Password
                </button>
</form>
<!-- Secondary Action -->
<div class="mt-8 text-center">
<p class="text-body-sm font-body-sm text-on-surface-variant">
                    Remember your password? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Log In</a>
</p>
</div>
</div>
</main>
<!-- Interactive script for visibility toggle -->
<script>
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });
    </script>
</body></html>
