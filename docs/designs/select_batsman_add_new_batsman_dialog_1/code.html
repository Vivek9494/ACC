<script>
        // Micro-interactions
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('click', function() {
                const indicator = this.querySelector('.border-2');
                if (indicator) {
                    // Simple toggle simulation
                    if (this.classList.contains('border-primary-container')) {
                        this.classList.remove('border-primary-container', 'solar-glow');
                        indicator.innerHTML = '';
                        indicator.classList.remove('bg-primary-container', 'text-on-primary-container', 'p-1', 'flex', 'items-center', 'justify-center');
                        indicator.classList.add('w-6', 'h-6', 'border-outline-variant');
                    } else {
                        this.classList.add('border-primary-container', 'solar-glow');
                        indicator.classList.remove('w-6', 'h-6', 'border-outline-variant');
                        indicator.classList.add('bg-primary-container', 'text-on-primary-container', 'p-1', 'flex', 'items-center', 'justify-center');
                        indicator.innerHTML = '<span class="material-symbols-outlined text-[20px]" data-icon="check_circle" style="font-variation-settings: \'FILL\' 1;">check_circle</span>';
                    }
                }
            });
        });
    </script>
