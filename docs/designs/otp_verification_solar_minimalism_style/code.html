<body class="bg-surface-bright min-h-screen flex flex-col items-center">
<!-- Top AppBar (Derived from Shared Components JSON) -->
<header class="w-full top-0 flex items-center px-margin-mobile h-16 z-10 fixed mt-5"><div class="flex items-center gap-4 w-full"><button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-200 bg-transparent" onclick="window.history.back()"><span class="material-symbols-outlined text-primary" style="color: rgb(255, 107, 0);">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Verify OTP</h1></div></header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[480px] px-margin-mobile pb-lg flex flex-col items-center pt-24">
<!-- Branding/Icon Section -->
<div class="p-6 bg-white rounded-full mb-8">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: &quot;FILL&quot; 1;">
                verified_user
            </span>
</div>
<!-- Text Content -->
<div class="text-center mb-xl">
<h2 class="font-headline-lg text-on-surface mb-xs text-headline-md">Check your phone</h2>
<p class="text-on-surface-variant max-w-[320px] mx-auto text-body-sm font-body-sm">
                Enter the 4-digit code sent to your mobile number <span class="text-on-surface font-bold">+91 XXXXX XXXXX</span>
</p>
</div>
<!-- OTP Input Form -->
<form class="w-full flex flex-col items-center">
<div class="flex gap-4 mb-xl" id="otp-container">
<input autocomplete="one-time-code" class="otp-input w-16 h-16 text-center text-headline-md font-headline-md border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-surface-container-low rounded-xl border" inputmode="numeric" maxlength="1" pattern="\d*" type="number">
<input class="otp-input w-16 h-16 text-center text-headline-md font-headline-md border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-surface-container-low rounded-xl border" inputmode="numeric" maxlength="1" pattern="\d*" type="number">
<input class="otp-input w-16 h-16 text-center text-headline-md font-headline-md border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-surface-container-low rounded-xl border" inputmode="numeric" maxlength="1" pattern="\d*" type="number">
<input class="otp-input w-16 h-16 text-center text-headline-md font-headline-md border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all bg-surface-container-low rounded-xl border" inputmode="numeric" maxlength="1" pattern="\d*" type="number">
</div>
<!-- Primary Action Button -->
<button class="w-full py-4 hover:opacity-90 font-headline-md rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg border-0 bg-primary-container shadow-primary-container/30 text-on-primary" type="submit"><span class="">Verify &amp; Proceed</span><span class="material-symbols-outlined text-xl">arrow_forward</span></button>
</form>
<!-- Secondary Actions -->
<div class="mt-lg text-center">
<p class="font-body-md text-on-surface-variant text-body-sm font-body-sm">
                Didn't receive the code? 
                <a class="hover:underline transition-all font-label-md" href="#" style="color: rgb(255, 107, 0);">Resend OTP</a>
</p>
<!-- Countdown Timer Simulation -->
<p class="mt-xs font-label-sm text-label-sm text-outline hidden text-body-sm font-body-sm" id="timer">Resend available in <span class="font-bold">00:01</span></p>
</div>
</main>
<!-- Visual Atmosphere: Subtle background texture/blur elements -->
<div class="fixed bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-surface-container-low to-transparent -z-10 pointer-events-none"></div>
<div class="fixed top-20 -right-20 w-64 h-64 bg-secondary-container/10 blur-[100px] rounded-full -z-10"></div>
<div class="fixed bottom-20 -left-20 w-80 h-80 bg-primary-container/5 blur-[120px] rounded-full -z-10"></div>
<script>
        // Micro-interaction for OTP inputs
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('keyup', (e) => {
                if (e.key >= 0 && e.key <= 9) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                } else if (e.key === 'Backspace') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });

            // Prevent more than 1 char
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
            });
        });

        // Simple Timer Logic
        let seconds = 59;
        const timerElement = document.getElementById('timer');
        const countdown = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(countdown);
                timerElement.classList.add('hidden');
            } else {
                timerElement.querySelector('span').innerText = `00:${seconds < 10 ? '0' : ''}${seconds}`;
            }
        }, 1000);

        // Form Submit Interaction
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
                btn.style.backgroundColor = '#4CAF50';
                setTimeout(() => {
                    alert('OTP Verified Successfully!');
                    btn.innerText = originalText;
                    btn.style.backgroundColor = '';
                    btn.disabled = false;
                }, 1000);
            }, 1500);
        });
    </script>
