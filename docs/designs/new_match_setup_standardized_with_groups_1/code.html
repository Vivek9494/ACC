<style>
        body {
            background-color: #F4F4F8;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2A2C41;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-input {
            background: #ffffff;
            border: 1px solid rgba(226, 191, 176, 0.5);
            box-shadow: 0px 4px 12px rgba(42, 44, 65, 0.03);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            box-shadow: 0px 8px 20px rgba(255, 107, 0, 0.1);
            border-color: #FF724C;
        }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
    </style>

<body class="text-on-surface antialiased overflow-x-hidden min-h-screen">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-transparent">
<div class="flex justify-between items-center px-gutter h-16 w-full max-w-max-width mx-auto">
<div class="flex items-center">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high/50 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[24px] text-primary">arrow_back</span>
</button>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm shrink-0 active:scale-95 duration-200 cursor-pointer">
<img alt="User Profile Icon" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCiZDTvHMKKdEBd-ohgDF0PePbE7vXhG8kaYyt8QI68jXjqzu1xoE9EmlkO2c9WK22nfBQi-Dewm54MspLrTG7YD_t5xrsbrrhqRix8nw6JF-WPiEtFFG_hm7LzHyul9k-DVo8Yl7BAv4Q5lTWg_ujvCkYAxfxOZ5dFk3sRf1C-78jQJGh-TjlOEggkXrGZKdvcFAZHNocNx0kuWaIPcZHzFHSy3pMajJQA1UNv1-oGjIlMmdx-skDyapCsiAh1ersm0Oc6z5VSBJuc">
</div>
</div>
</div>
</header>
<!-- Main Content -->
<main class="pt-20 pb-32 px-4 md:px-gutter max-w-2xl mx-auto">
<div class="mb-8">
<h2 class="font-headline-md text-headline-md text-on-surface">Match Setup</h2>
<p class="font-body-sm text-on-surface-variant">Configure details for the upcoming Round Robin fixture.</p>
</div>
<form class="space-y-8" id="matchSetupForm">
<!-- Group Name Selection -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Group Name</label>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant">
<option disabled="" selected="" value="">Select Group</option>
<option value="group-a">Group A - Regional Qualifiers</option>
<option value="group-b">Group B - Elite League</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Teams Selection -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Team A</label>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant" id="teamA">
<option selected="" value="">Select Team A</option>
<option value="strikers">Solar Strikers</option>
<option value="eagles">Golden Eagles</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Team B</label>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant" id="teamB">
<option selected="" value="">Select Team B</option>
<option value="wolves">Thunder Wolves</option>
<option value="oceanic">Oceanic XI</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Ground Location -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Ground Location</label>
<div class="relative">
<input class="w-full glass-input p-4 pl-12 text-body-md outline-none rounded-lg border border-outline-variant" placeholder="Enter stadium or city" type="text">
<span class="material-symbols-outlined absolute left-4 top-4 text-on-surface-variant">location_on</span>
</div>
</div>
<!-- Match Specs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Overs</label>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant">
<option value="20">20 Overs (T20)</option>
<option value="50">50 Overs (ODI)</option>
<option value="test">Test Match</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Overs per bowler</label>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant">
<option value="4">4 Overs</option>
<option value="10">10 Overs</option>
<option value="unlimited">No Limit</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Date & Time -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Match Date</label>
<div class="relative">
<input class="w-full glass-input p-4 pl-12 text-body-md outline-none rounded-lg border border-outline-variant" type="date">
<span class="material-symbols-outlined absolute left-4 top-4 text-on-surface-variant">calendar_today</span>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Match Time</label>
<div class="relative">
<input class="w-full glass-input p-4 pl-12 text-body-md outline-none rounded-lg border border-outline-variant" type="time">
<span class="material-symbols-outlined absolute left-4 top-4 text-on-surface-variant">schedule</span>
</div>
</div>
</div>
<!-- Officials -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Officials</label>
<div class="grid grid-cols-1 gap-4">
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant">
<option disabled="" selected="" value="">Select Umpire</option>
<option>Michael Gough</option>
<option>Richard Illingworth</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant">
<option disabled="" selected="" value="">Select Second Umpire</option>
<option>Nitin Menon</option>
<option>Richard Kettleborough</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="relative">
<select class="w-full glass-input p-4 text-body-md outline-none appearance-none rounded-lg border border-outline-variant">
<option disabled="" selected="" value="">Select Scorer</option>
<option>Alice Johnson</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-md">
<button class="w-full h-14 bg-primary text-on-primary font-bold text-body-lg shadow-[0px_4px_20px_rgba(255,107,0,0.15)] hover:bg-primary-container transition-all active:scale-[0.98] duration-150 flex items-center justify-center gap-base rounded-lg" type="submit">
<span class="">Schedule Match</span>
<span class="material-symbols-outlined">calendar_today</span>
</button>
</div>
</form>
<!-- Format Details & Standings -->

</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 w-full z-50 bg-white border-t border-outline-variant/20 px-2 pb-safe shadow-[0px_-8px_30px_rgba(42,44,65,0.06)]">
<div class="flex justify-around items-center h-20 px-4 w-full">
<a class="flex flex-col items-center justify-center text-on-surface/60 hover:text-primary active:scale-90 transition-all duration-150" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary text-white px-6 py-2 active:scale-90 duration-150 rounded-lg" href="#">
<span class="material-symbols-outlined">sports_cricket</span>
<span class="font-label-sm">Matches</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface/60 hover:text-primary active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="font-label-sm">Teams</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface/60 hover:text-primary active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-label-sm">Stats</span>
</a>
</div>
</nav>
<script>
        const form = document.getElementById('matchSetupForm');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Scheduling...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Scheduled';
                btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('bg-tertiary-container', 'text-on-tertiary-container');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>


</body></html>
