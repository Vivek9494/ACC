<style>.material-symbols-outlined {

    text-transform: none;

    }
.glass-card {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(226, 226, 233, 0.5);

    }

<body class="min-h-screen text-on-surface font-body-md" style="background-color: #F4F4F8;">
<!-- Top Navigation Header -->
<header class="fixed top-0 left-0 right-0 z-50 h-16 flex items-center px-margin-mobile mt-5">
<div class="flex items-center gap-4 w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:scale-95 duration-200" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Forgot Password</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-32 px-margin-mobile flex flex-col items-center justify-center min-h-[80vh] max-w-lg mx-auto">
<!-- Decorative Sports Illustration (Simplified) -->

<!-- Form Section -->
<div class="w-full glass-card rounded-xl p-8 space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
<div class="space-y-2">


</div>
<form class="space-y-6" id="forgot-password-form">
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="mobile_number">
                        Enter Mobile Number to get OTP
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="text-on-surface-variant font-body-md border-r border-outline-variant pr-3">+91</span>
</div>
<input class="block w-full pl-16 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md input-focus-ring transition-all placeholder:text-outline-variant" id="mobile_number" maxlength="10" name="mobile_number" placeholder="98765 43210" required="" type="tel">
</div>
</div>
<button class="w-full py-4 bg-primary-container text-on-primary font-label-md text-label-md rounded-xl shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
<span class="">Send OTP</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer / Help Link -->
<div class="mt-8 text-center space-y-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Remember your password? 
                <a class="text-primary font-label-md hover:underline" href="#">Login here</a>
</p>

</div>
</main>
<!-- Visual Watermark Decoration Layer -->

<script>
        // Simple micro-interaction for the form
        document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> <span>Sending...</span>';
            
            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span>OTP Sent</span>';
                btn.classList.replace('bg-primary-container', 'bg-tertiary');
                
                setTimeout(() => {
                    alert('OTP has been sent to your mobile number.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary', 'bg-primary-container');
                }, 1500);
            }, 2000);
        });

        // Background movement effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.querySelector('.bg-watermark').style.backgroundPosition = `${moveX}px ${moveY}px`;
        });
    </script>


</body></html>
