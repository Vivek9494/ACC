<script>
        // Simple micro-interaction for photo upload preview
        document.getElementById('photo-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('profile-preview').src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Feedback for Update Profile button
        const updateBtn = document.querySelector('button[type="button"]');
        updateBtn.addEventListener('click', () => {
            const originalText = updateBtn.innerHTML;
            updateBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><span class="animate-spin material-symbols-outlined">progress_activity</span> Updating...</span>';
            setTimeout(() => {
                updateBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><span class="material-symbols-outlined">check_circle</span> Profile Updated</span>';
                setTimeout(() => {
                    updateBtn.innerHTML = originalText;
                }, 2000);
            }, 1200);
        });
    </script>
