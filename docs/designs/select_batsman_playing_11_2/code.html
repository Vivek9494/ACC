<!DOCTYPE html>
<html class="light" lang="en">
<head>

    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                    "inverse-primary": "#ffb693",
                    "secondary-fixed-dim": "#e9c400",
                    "primary-fixed": "#ffdbcc",
                    "on-primary-fixed-variant": "#7a3000",
                    "on-background": "#1a1c1e",
                    "primary-fixed-dim": "#ffb693",
                    "outline": "#8e7164",
                    "primary": "#a04100",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed": "#351000",
                    "on-primary-container": "#572000",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#e2bfb0",

                    "inverse-surface": "#2f3133",

                    "on-error": "#ffffff",
                    "on-tertiary-container": "#003357",
                    "on-error-container": "#93000a",
                    "inverse-on-surface": "#f0f0f3",
                    "secondary-container": "#fdd400",
                    "on-surface": "#1a1c1e",

                    "body-sm": ["Plus Jakarta Sans"],

</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
    <!-- Top App Bar -->
    <header class="fixed top-0 w-full z-50 bg-surface/60 backdrop-blur-xl border-b border-white/20 h-16 flex items-center justify-between px-gutter max-w-md mx-auto">
        <div class="flex items-center gap-4">
            <button class="active:scale-95 transition-transform duration-200 text-on-surface-variant p-2 rounded-full">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h1 class="font-headline-md text-headline-md text-on-surface">Select Batsman</h1>
        </div>
        <button class="active:scale-95 transition-transform duration-200 text-primary p-2 rounded-full">
            <span class="material-symbols-outlined">search</span>
        </button>
    </header>

    <!-- Content Area -->
    <main class="w-full max-w-md mt-16 mb-24 px-margin-mobile flex flex-col gap-4 py-6">
        <!-- Team Header -->
        <div class="flex items-center justify-between py-2">
            <div>
                <h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Batting Team</h2>
                <p class="font-headline-md text-headline-md text-primary">Lions CC</p>
            </div>
            <div class="bg-secondary-container text-on-secondary-container px-3 py-1 rounded-lg font-label-sm text-label-sm">
                Playing 11
            </div>
        </div>

        <!-- Players List -->
        <div class="flex flex-col gap-3">
            <!-- Player Card 1 (Batting) -->
            <button class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm hover:shadow-md transition-shadow active:scale-[0.98] duration-150 text-left group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg overflow-hidden border-2 border-primary-container relative">
                        <img alt="Arjun Sharma" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAwjrzb9I-BzavbG6HtvOyHEKnkh3Ws38aW2AjjsdqwxrArP8MVaQu16ZkQeMgDcenk8afEpeDEG3cqrUcsVew9dNrHYKx8t_qSaH1BD3lxKVqryEgNaTZ6nuWOtLzTjdgB16WEbIT6j5s-Os-XQtxg6H8HumZ42bXyGhC-Bp-C9r18RccnRmKtDHjFZNpjLQhdSyy6C2RJtUQ7-1XrFn-Ff0Xuc1AQKFDK7ElzcFNiQVvlqcpI5cnfTB_n66KuwGguUIgWka0sz7X2"/>
                    </div>
                    <div>
                        <p class="font-headline-md text-[18px] text-on-surface">Arjun Sharma</p>
                        <div class="flex items-center gap-2">
                            <span class="font-label-sm text-label-sm text-primary">Striker</span>
                            <span class="w-1 h-1 rounded-full bg-outline-variant"></span>
                            <span class="font-label-sm text-label-sm text-on-surface-variant">45 (32)</span>
                        </div>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-primary-container text-white">
                    <span class="material-symbols-outlined text-xl">sports_cricket</span>
                </div>
            </button>

            <!-- Player Card 2 -->
            <button class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm hover:shadow-md transition-shadow active:scale-[0.98] duration-150 text-left group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg overflow-hidden border border-outline-variant">
                        <img alt="Kevin Peterson" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrIika6TXX6Gtd6QYn27C4lH8AmzK44kehv09YbPy-_LxmMOZfNDveWox9KpxzsH0CkVFbMqhGU-IuXIp_MsihG0gVx1XpNgFXI_jK_StFRClTasPgc-i6dO3ATyuBmWY-J5PJKaLhLQn9vEL8KRyE5CA-QVRZ2Dwbkas44auG0J7X-erhzW3pf2VGVeJOOZKprvI3DedeiRQVyhMURIcE8Gg2u2Juh3iR0DHS8UYLQC4oTYmNySBSPusiGEiIveMz_-8ogy6Hkhbl"/>
                    </div>
                    <div>
                        <p class="font-headline-md text-[18px] text-on-surface">Kevin Peterson</p>
                        <p class="font-label-sm text-label-sm text-on-surface-variant">Waiting to Bat</p>
                    </div>
                </div>
                <span class="material-symbols-outlined text-outline-variant group-hover:text-primary">add_circle</span>
            </button>

            <!-- Player Card 3 -->
            <button class="flex items-center justify-between p-4 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-sm hover:shadow-md transition-shadow active:scale-[0.98] duration-150 text-left group">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg overflow-hidden border border-outline-variant">
                        <img alt="Sarah Johnson" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPhslmChQ8zJBnGQOSdORptGvM5PzOFwAHKmS6oHQSHdOjCOJk56RylNBEZtOasvTFnUoiZSlQ3FlNNOLVW1IoRdl67lViY091BBaqiUu2YyC5boNDPDWZ0B0C2yHc3iS32X3D6wUurkDP7Yz_WAA0dTv9WkGsBMPgfEhJMH_AdJyn5Dq_mWO_Tgpwt80FxVikjM7TUWMr3arblusZnjrfRvAE9xiDv6w1l4ZSUKNEdcvPmXVQGW33pi0rpOW8qxYh7R5NdUVm-vVh"/>
                    </div>
                    <div>
                        <p class="font-headline-md text-[18px] text-on-surface">Sarah Johnson</p>
                        <p class="font-label-sm text-label-sm text-on-surface-variant">Waiting to Bat</p>
                    </div>
                </div>
                <span class="material-symbols-outlined text-outline-variant group-hover:text-primary">add_circle</span>
            </button>
        </div>
    </main>

    <!-- Footer Action Bar -->
    <footer class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-t border-white/20 h-20 px-4 pb-safe max-w-md mx-auto flex items-center justify-center">
        <button class="w-full h-12 bg-primary-container text-white rounded-lg font-headline-md text-[16px] flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 active:scale-95 transition-transform duration-200">
            <span class="material-symbols-outlined">add</span>
            Add New Batsman
        </button>
    </footer>
</body>
</html>
