<!DOCTYPE html><html class="light" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Add Tournament - Hariprabodham SC</title>
<!-- Fonts and Icons -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

        tailwind.config = {

                        "on-primary": "#ffffff",

                        "tertiary-fixed": "#d0e4ff",
                        "on-surface-variant": "#5a4136",
                        "secondary-container": "#fdd400",
                        "surface": "#f9f9fc",
                        "on-primary-fixed": "#351000",
                        "on-background": "#1a1c1e",
                        "tertiary": "#0062a1",
                        "surface-tint": "#a04100",
                        "outline": "#8e7164",
                        "surface-container-high": "#e8e8ea",
                        "on-secondary-fixed": "#221b00",
                        "surface-container-highest": "#e2e2e5"
                    },
                    "borderRadius": {

                    "spacing": {

                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],

                        "headline-xl-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}],

                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

                },
            },
        }

<style>
        body {
            background-color: #f9f9fc;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e2e5;
            border-radius: 10px;
        }
        body {
          min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="text-on-surface antialiased overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-transparent">
<div class="flex justify-between items-center px-gutter h-20 w-full max-w-max-width mx-auto"><div class="flex items-center"><button class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high hover:bg-surface-variant transition-colors active:scale-95 duration-200"><span class="material-symbols-outlined text-primary text-[20px] ml-1.5">arrow_back_ios</span></button></div><div class="flex items-center"><div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container shrink-0"><img alt="User Profile Icon" class="w-full h-full object-cover" src="{{DATA:IMAGE:user_avatar_placeholder}}"></div></div></div>
</header>
<main class="pt-24 pb-32 px-4 md:px-gutter max-w-2xl mx-auto">
<div class="mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Tournament</h2>
<p class="font-body-sm text-on-surface-variant">Fill in the details to create a new tournament event.</p>
</div>
<!-- Form Fields Directly on Background -->
<div class="space-y-8">
<!-- Poster Upload Section -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament poster</label>
<div class="relative group cursor-pointer border-2 border-dashed border-outline-variant rounded-xl h-48 flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-low transition-all duration-300">
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file">
<span class="material-symbols-outlined text-primary text-5xl mb-2 group-hover:scale-110 transition-transform">add_photo_alternate</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tap to upload poster</p>
<p class="font-label-sm text-label-sm text-outline">JPEG, PNG up to 5MB</p>
</div>
</div>
<!-- Basic Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="space-y-xs md:col-span-2">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament Name</label>
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" placeholder="e.g. Hariprabodham Premiere League" type="text">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament Year</label>
<select class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none appearance-none">
<option>2024</option>
<option>2025</option>
<option>2026</option>
</select>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament Start Date</label>
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" type="date">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament End Date</label>
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" type="date">
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament Location</label>
<div class="relative">
<input class="w-full bg-white border border-outline-variant rounded-lg p-3 pl-10 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" placeholder="Search venue or city..." type="text">
<span class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant">location_on</span>
</div>
</div>
</div>
<!-- Ball Type Selection -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface-variant">Ball Type</label>
<div class="flex gap-lg">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary-container" name="ball_type" onchange="toggleBallOptions(this.value)" type="radio" value="tennis">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Tennis Ball</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary-container" name="ball_type" onchange="toggleBallOptions(this.value)" type="radio" value="leather">
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Leather Ball</span>
</label>
</div>
</div>
<!-- Conditional Section: Tennis Ball Options -->
<div class="hidden space-y-md animate-in fade-in slide-in-from-top-2 duration-300" id="tennis_options">
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament For</label>
<div class="flex gap-lg">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary-container" name="tournament_for" onchange="toggleCityDropdown(this.value)" type="radio" value="all">
<span class="font-body-md text-body-md text-on-surface">All the Centers</span>
</label>
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-5 h-5 text-primary border-outline-variant focus:ring-primary-container" name="tournament_for" onchange="toggleCityDropdown(this.value)" type="radio" value="multi">
<span class="font-body-md text-body-md text-on-surface">Multi-cities</span>
</label>
</div>
</div>
<div class="hidden space-y-xs animate-in fade-in slide-in-from-top-2 duration-300" id="city_dropdown">
<label class="font-label-md text-label-md text-on-surface-variant">Select City</label>
<select class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none appearance-none">
<option>Ahmedabad</option>
<option>Surat</option>
<option>Vadodara</option>
<option>Rajkot</option>
<option>Mumbai</option>
</select>
</div>
</div>
<!-- Overs Logic -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md pt-4">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Tournament Overs (per inning)</label>
<select class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all appearance-none">
<option>10 Overs</option>
<option>12 Overs</option>
<option>15 Overs</option>
<option>20 Overs</option>
</select>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Max overs bowler can bowl</label>
<select class="w-full bg-white border border-outline-variant rounded-lg p-3 text-body-md focus:ring-2 focus:ring-primary-container focus:border-primary transition-all appearance-none">
<option>2 Overs</option>
<option>3 Overs</option>
<option>4 Overs</option>
</select>
</div>
</div>
<!-- Features Checkboxes -->
<div class="flex flex-col gap-4 pt-4 border-t border-outline-variant">
<label class="flex items-center gap-3 cursor-pointer select-none">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline focus:ring-primary-container text-primary transition-all" type="checkbox">
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Impact Player</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Enable strategic player substitution during the match</span>
</div>
</label>
<label class="flex items-center gap-3 cursor-pointer select-none">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-outline focus:ring-primary-container text-primary transition-all" type="checkbox">
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface">Video Required?</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Request match recording or live streaming coverage</span>
</div>
</label>
</div>
</div>
<!-- Action Button -->
<div class="mt-12 mb-20">
<button class="w-full bg-secondary-container hover:bg-secondary-container/90 text-on-secondary-container font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98] text-headline-md flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add_circle</span>
                Create Tournament
            </button>
</div>
</main>
<!-- Bottom Navigation Bar (Social Version) -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container-lowest border-t border-outline-variant px-2 pb-safe">
<div class="flex justify-around items-center h-20 w-full max-w-max-width mx-auto">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px]" href="#">
<div class="bg-primary-container text-on-primary-container rounded-full px-5 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">home</span>
</div>
<span class="font-label-sm text-label-sm font-bold text-on-surface">Home</span>
</a>
<!-- Matches -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant" href="#">
<span class="material-symbols-outlined">sports_cricket</span>
<span class="font-label-sm text-label-sm">Matches</span>
</a>
<!-- Stats -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant" href="#">
<span class="material-symbols-outlined">leaderboard</span>
<span class="font-label-sm text-label-sm">Stats</span>
</a>
<!-- Social -->
<a class="flex flex-col items-center justify-center gap-1 min-w-[64px] text-on-surface-variant" href="#">
<span class="material-symbols-outlined">groups</span>
<span class="font-label-sm text-label-sm">Social</span>
</a>
</div>
</nav>
<script>
        function toggleBallOptions(value) {
            const tennisOptions = document.getElementById('tennis_options');
            if (value === 'tennis') {
                tennisOptions.classList.remove('hidden');
                tennisOptions.classList.add('block');
            } else {
                tennisOptions.classList.add('hidden');
                tennisOptions.classList.remove('block');
                document.getElementById('city_dropdown').classList.add('hidden');
            }
        }

        function toggleCityDropdown(value) {
            const cityDropdown = document.getElementById('city_dropdown');
            if (value === 'multi') {
                cityDropdown.classList.remove('hidden');
                cityDropdown.classList.add('block');
            } else {
                cityDropdown.classList.add('hidden');
                cityDropdown.classList.remove('block');
            }
        }
    </script>


</body></html>
