<script>
        // Simple Interaction logic for checkboxes to visually highlight selected cards
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const card = this.closest('label');
                if (this.checked) {
                    card.classList.add('border-primary', 'bg-primary/5');
                } else {
                    card.classList.remove('border-primary', 'bg-primary/5');
                }
            });
        });

        // Atmospheric touch: Ripple effect on the primary button
        const createBtn = document.querySelector('button.bg-primary-container');
        createBtn.addEventListener('click', (e) => {
            const circle = document.createElement('span');
            const diameter = Math.max(createBtn.clientWidth, createBtn.clientHeight);
            const radius = diameter / 2;
            
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - createBtn.getBoundingClientRect().left - radius}px`;
            circle.style.top = `${e.clientY - createBtn.getBoundingClientRect().top - radius}px`;
            circle.classList.add('ripple');
            
            const rippleStyle = document.createElement('style');
            rippleStyle.innerHTML = `
                .ripple {
                    position: absolute;
                    background: rgba(255, 255, 255, 0.3);
                    border-radius: 50%;
                    transform: scale(0);
                    animation: ripple 0.6s linear;
                    pointer-events: none;
                }
                @keyframes ripple {
                    to { transform: scale(4); opacity: 0; }
                }
            `;
            document.head.appendChild(rippleStyle);
            createBtn.appendChild(circle);
            
            setTimeout(() => circle.remove(), 600);
        });
    </script>
