<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-mobile max-w-[600px] mx-auto min-h-screen">
<!-- Section Header -->
<section class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Add Team</h2>
<p class="font-body-md text-on-surface-variant">Upload logo and name your team</p>
</section>
<!-- Form Section -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Team Logo Upload -->
<div class="group relative">
<label class="block font-label-md text-label-md text-on-surface mb-sm">Team Logo</label>
<div class="w-full aspect-square md:aspect-video rounded-xl border-2 border-dashed border-outline-variant hover:border-primary hover:bg-primary-fixed/20 transition-all duration-300 cursor-pointer flex flex-col items-center justify-center gap-base overflow-hidden" id="upload-area">
<span class="material-symbols-outlined text-[48px] text-primary-container" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="font-label-md text-label-md text-primary-container">Tap to upload team logo</span>
<input accept="image/*" class="hidden" id="logo-input" type="file">
</div>
</div>
<!-- Team Name Input -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="team-name">Team Name</label>
<input class="w-full h-14 px-md bg-surface-container-lowest border border-outline-variant rounded-lg focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all outline-none font-body-md text-on-surface placeholder:text-outline/50" id="team-name" placeholder="e.g. Barrie Cobras" type="text">
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full h-14 bg-primary-container text-on-primary font-bold text-body-lg rounded-xl shadow-[0px_4px_20px_rgba(255,107,0,0.15)] hover:bg-primary transition-all active:scale-[0.98] duration-150 flex items-center justify-center gap-base" type="submit">
<span class="">Add Team</span>
</button>
</div>

</main>
<!-- BottomNavBar (Hidden on this transactional screen as per logic "Linear/Transactional: suppress navigation shell") -->
<!-- The FAB is also suppressed for transactional/form-entry screens -->
<script>
        // Simple Interaction logic
        const uploadArea = document.getElementById('upload-area');
        const logoInput = document.getElementById('logo-input');

        uploadArea.addEventListener('click', () => {
            logoInput.click();
        });

        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    uploadArea.innerHTML = `<img src="${event.target.result}" class="w-full h-full object-contain p-4">`;
                    uploadArea.classList.remove('border-dashed');
                    uploadArea.classList.add('border-solid');
                };
                reader.readAsDataURL(file);
            }
        });

        // Form Submission micro-interaction
        document.querySelector('form').addEventListener('submit', () => {
            const btn = document.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            setTimeout(() => {
                btn.innerHTML = '<span>Team Added!</span>';
                btn.classList.replace('bg-primary-container', 'bg-tertiary-container');
            }, 1500);
        });
    </script>
