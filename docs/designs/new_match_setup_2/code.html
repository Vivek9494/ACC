<style>
      body {
        background-color: #F4F4F8;
        background-image: radial-gradient(at 0% 0%, rgba(255, 114, 76, 0.05) 0px, transparent 50%),

      }
      .progress-glow {
        box-shadow: 0 0 12px rgba(255, 114, 76, 0.4);

<body class="font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/60 backdrop-blur-xl border-b border-white/20 shadow-[0px_4px_24px_rgba(0,0,0,0.04)] h-16">
<div class="flex items-center justify-between px-gutter h-full w-full max-w-md mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="sports_cricket">sports_cricket</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">CricketLive</h1>
</div>
<button class="hover:bg-white/10 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="close">close</span>
</button>
</div>
</header>
<main class="pt-24 pb-32 px-gutter max-w-md mx-auto min-h-screen">
<!-- Welcome Section -->
<section class="mb-stack-md">
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface mb-2">Setup Match</h2>
<p class="font-body-md text-on-surface-variant">Configure your local match details to start scoring in real-time.</p>
</section>
<!-- Main Form Glass Card -->
<div class="glass-card rounded-xl p-container-margin shadow-[0px_4px_24px_rgba(0,0,0,0.04)] space-y-stack-md">
<!-- Team Names -->
<div class="space-y-4">
<div class="relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-2 px-1">TEAM A NAME</label>
<input class="glass-input w-full px-4 py-3 rounded-lg font-body-md text-on-surface border-b-2 border-transparent focus:border-primary-container" placeholder="e.g. Mumbai Indians" type="text"/>
</div>
<div class="flex justify-center -my-2 relative z-10">
<div class="bg-white p-2 rounded-full shadow-sm border border-white/50 text-primary-container">
<span class="material-symbols-outlined text-[20px]" data-icon="swap_vert">swap_vert</span>
</div>
</div>
<div class="relative group">
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-2 px-1">TEAM B NAME</label>
<input class="glass-input w-full px-4 py-3 rounded-lg font-body-md text-on-surface border-b-2 border-transparent focus:border-primary-container" placeholder="e.g. Chennai Super Kings" type="text"/>
</div>
</div>
<hr class="border-white/20"/>
<!-- Format Selection -->
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-4 px-1">MATCH FORMAT</label>
<div class="grid grid-cols-3 gap-3">
<button class="active-pill py-3 rounded-lg font-label-sm text-label-sm transition-all text-center">T20</button>
<button class="bg-white/40 border border-white/50 py-3 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-white/60 transition-all text-center">ODI</button>
<button class="bg-white/40 border border-white/50 py-3 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-white/60 transition-all text-center">TEST</button>
</div>
</div>
<!-- Toss Setup -->
<div>
<label class="font-label-sm text-label-sm text-on-surface-variant block mb-4 px-1">TOSS RESULT</label>
<div class="space-y-4">
<div class="flex items-center gap-3">
<span class="font-body-md text-on-surface-variant w-24">Who won?</span>
<div class="flex-1 flex gap-2">
<button class="flex-1 bg-white/40 border border-white/50 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant active:scale-95 transition-all">Team A</button>
<button class="flex-1 bg-white/40 border border-white/50 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant active:scale-95 transition-all">Team B</button>
</div>
</div>
<div class="flex items-center gap-3">
<span class="font-body-md text-on-surface-variant w-24">Elected to:</span>
<div class="flex-1 flex gap-2">
<button class="flex-1 active-pill py-2 rounded-lg font-label-sm text-label-sm active:scale-95 transition-all flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="sports_cricket">sports_cricket</span> Bat
                            </button>
<button class="flex-1 bg-white/40 border border-white/50 py-2 rounded-lg font-label-sm text-label-sm text-on-surface-variant hover:bg-white/60 active:scale-95 transition-all flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="sports_handball">sports_handball</span> Bowl
                            </button>
</div>
</div>
</div>
</div>
</div>

<div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/60 to-transparent">
<p class="font-label-sm text-label-sm text-white/90">VENUE PREVIEW</p>
<p class="font-headline-md text-headline-md text-white">Lord's Cricket Ground</p>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-stack-lg">
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-4 rounded-xl shadow-[0px_8px_32px_rgba(255,114,76,0.3)] active:scale-95 transition-all flex items-center justify-center gap-3">
                Start Match
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/60 backdrop-blur-xl border-t border-white/20 shadow-[0px_-4px_24px_rgba(0,0,0,0.04)]">
<div class="flex justify-around items-center w-full h-20 px-4 pb-safe max-w-md mx-auto">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-white/10 transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="live_tv">live_tv</span>
<span class="font-label-sm text-label-sm">Live</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-white/10 transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-sm text-label-sm">Scorecard</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container/20 text-primary rounded-xl px-4 py-1 hover:bg-white/10 transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-sm text-label-sm">Setup</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-white/10 transition-colors active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</div>
</nav>
<script>
        // Simple Interaction logic for Format selection
        const formatButtons = document.querySelectorAll('div.grid.grid-cols-3 button');
        formatButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                formatButtons.forEach(b => {
                    b.classList.remove('active-pill');
                    b.classList.add('bg-white/40', 'text-on-surface-variant');
                });
                btn.classList.add('active-pill');
                btn.classList.remove('bg-white/40', 'text-on-surface-variant');
            });
        });

        // Simple Toss Elect selection
        const electButtons = document.querySelectorAll('button:has(span[data-icon="sports_cricket"]), button:has(span[data-icon="sports_handball"])');
        electButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                electButtons.forEach(b => {
                    b.classList.remove('active-pill');
                    b.classList.add('bg-white/40', 'text-on-surface-variant');
                });
                btn.classList.add('active-pill');
                btn.classList.remove('bg-white/40', 'text-on-surface-variant');
            });
        });
    </script>
