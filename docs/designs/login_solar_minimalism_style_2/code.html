<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Login - Hariprabodham Sports Club</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-fixed": "#d0e4ff",
            "surface-dim": "#dadadc",
            "primary": "#a04100",
            "on-primary-container": "#572000",
            "surface": "#f9f9fc",
            "error-container": "#ffdad6",
            "tertiary": "#0062a1",
            "outline-variant": "#e2bfb0",
            "on-surface": "#1a1c1e",
            "surface-container-highest": "#e2e2e5",
            "secondary-container": "#fdd400",
            "on-surface-variant": "#5a4136",
            "on-background": "#1a1c1e",
            "on-secondary-fixed": "#221b00",
            "on-primary-fixed": "#351000",
            "outline": "#8e7164",
            "on-secondary": "#ffffff",
            "background": "#f9f9fc",
            "tertiary-container": "#059eff",
            "secondary": "#705d00",
            "primary-fixed-dim": "#ffb693",
            "on-tertiary-container": "#003357",
            "on-tertiary-fixed": "#001d35",
            "inverse-surface": "#2f3133",
            "error": "#ba1a1a",
            "inverse-on-surface": "#f0f0f3",
            "surface-tint": "#a04100",
            "primary-container": "#ff6b00",
            "on-error": "#ffffff",
            "secondary-fixed-dim": "#e9c400",
            "on-primary-fixed-variant": "#7a3000",
            "on-secondary-fixed-variant": "#544600",
            "surface-container-lowest": "#ffffff",
            "on-tertiary": "#ffffff",
            "on-secondary-container": "#6f5c00",
            "tertiary-fixed-dim": "#9ccaff",
            "on-error-container": "#93000a",
            "surface-container-high": "#e8e8ea",
            "on-tertiary-fixed-variant": "#00497b",
            "primary-fixed": "#ffdbcc",
            "surface-container-low": "#f3f3f6",
            "surface-bright": "#f9f9fc",
            "surface-container": "#eeeef0",
            "on-primary": "#ffffff",
            "surface-variant": "#e2e2e5",
            "secondary-fixed": "#ffe170",
            "inverse-primary": "#ffb693"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "max-width": "1280px",
            "gutter": "24px",
            "xs": "4px",
            "sm": "12px",
            "xl": "64px",
            "margin-mobile": "16px",
            "margin-desktop": "auto",
            "md": "24px",
            "lg": "40px",
            "base": "8px"
          },
          "fontFamily": {
            "sans": ["Plus Jakarta Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style data-purpose="custom-shadows">
    .soft-shadow-input {
      box-shadow: 0 4px 15px -1px rgba(0, 0, 0, 0.05), 0 2px 10px -1px rgba(0, 0, 0, 0.025);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans text-on-surface antialiased bg-surface">
<!-- BEGIN: MainContainer -->
<main class="flex-1 flex flex-col px-8 pt-[20px] pb-10 max-w-md mx-auto w-full" data-purpose="login-screen-container">
<!-- BEGIN: HeaderSection -->
<section class="mb-10" data-purpose="branding-header">
<h1 class="text-[32px] font-bold tracking-tight text-on-surface mb-2">
        Jay Swaminarayan
      </h1>
<p class="text-on-surface-variant text-lg font-medium">
        Welcome back, you've been missed!
      </p>
</section>
<!-- END: HeaderSection -->
<!-- BEGIN: LoginForm -->
<form class="space-y-6" data-purpose="auth-form">
<!-- Mobile Number Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="mobile">
          Mobile Number
        </label>
<div class="relative">
<input class="w-full px-5 py-4 bg-surface-container-lowest rounded-lg soft-shadow-input text-on-surface placeholder-surface-dim focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none border-none" id="mobile" placeholder="10-digit mobile number" type="tel">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant ml-1" for="password">
          Password
        </label>
<div class="relative">
<input class="w-full px-5 py-4 bg-surface-container-lowest rounded-lg soft-shadow-input text-on-surface placeholder-surface-dim focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none border-none" id="password" placeholder="Enter your password" type="password">
<!-- Eye Icon (Password Toggle) -->
<div class="absolute inset-y-0 right-5 flex items-center">
<svg class="h-5 w-5 text-surface-dim" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between px-1">
<div class="flex items-center">
<input checked="" class="h-5 w-5 text-primary-container border-surface-container-highest rounded focus:ring-primary-container" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block text-sm font-semibold text-on-surface" for="remember-me">
            Remember Me
          </label>
</div>
<div class="text-sm">
<a class="font-semibold text-primary-container" href="#">
            Forgot Password ?
          </a>
</div>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full bg-primary-container hover:bg-on-primary-fixed-variant text-white font-bold py-5 rounded-lg flex items-center justify-center text-lg shadow-md active:scale-[0.98] transition-all border-none" type="submit">
          Login
        </button>
</div>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: FooterLinks -->
<div class="mt-auto pb-12" data-purpose="footer-navigation">
<div class="flex flex-col items-center space-y-8">
<!-- OR Divider -->
<div class="flex items-center w-full">
<div class="flex-grow h-px bg-surface-container-highest"></div>
<span class="px-4 text-xs font-semibold text-surface-dim uppercase tracking-widest">OR</span>
<div class="flex-grow h-px bg-surface-container-highest"></div>
</div>
<!-- Sign Up Prompt -->
<p class="text-on-surface-variant font-medium">
          Don't have an account ? 
          <a class="text-primary-container font-bold ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- END: FooterLinks -->
</main>
<!-- END: MainContainer -->


</body></html>
