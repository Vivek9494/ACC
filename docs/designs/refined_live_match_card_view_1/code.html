<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Match Card - Solar Minimalism</title>
<!-- Load Tailwind CSS v3 with relevant plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Load Plus Jakarta Sans font as specified in Design System -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#a04100",
            "on-primary": "#ffffff",
            "primary-container": "#ff6b00",
            "on-primary-container": "#572000",
            "secondary": "#705d00",
            "on-secondary": "#ffffff",
            "secondary-container": "#fdd400",
            "on-secondary-container": "#6f5c00",
            "tertiary": "#0062a1",
            "on-tertiary": "#ffffff",
            "error": "#ba1a1a",
            "on-error": "#ffffff",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "background": "#f9f9fc",
            "on-background": "#1a1c1e",
            "surface": "#f9f9fc",
            "on-surface": "#1a1c1e",
            "surface-variant": "#e2e2e5",
            "on-surface-variant": "#5a4136",
            "outline": "#8e7164",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f3f3f6",
            "surface-container": "#eeeef0",
            "surface-container-high": "#e8e8ea",
            "surface-container-highest": "#e2e2e5",
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          borderRadius: {
            'xl': '0.75rem',
            'solar-8': '2rem', // Keeping the custom curve from original for consistency with "Solar Minimalism"
          }
        }
      }
    }
  </script>
<style data-purpose="layout-styling">
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      background-color: #f9f9fc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    /* Custom shadow for the "Solar Minimalism" card feel */
    .solar-card-shadow {
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }
  </style>
</head>
<body class="bg-background">
<!-- BEGIN: LiveMatchFocusScreen -->
<main class="w-full max-w-md" data-purpose="focused-match-container">
<!-- BEGIN: LiveMatchCard -->
<section class="bg-surface-container-lowest rounded-xl p-6 relative overflow-hidden solar-card-shadow border border-surface-variant" data-purpose="live-match-card">
<!-- Card Header: Tournament and Live Badge -->
<div class="flex justify-between items-start mb-6">
<h2 class="text-primary font-bold text-sm">Inter-City Finals</h2>
<span class="flex items-center gap-1 bg-error-container text-error px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider">
<span class="material-symbols-outlined text-[10px]" style="font-variation-settings: 'FILL' 1;">fiber_manual_record</span>
          LIVE
        </span>
</div>
<!-- Match Scores Container: Three Column Layout -->
<div class="flex items-center justify-between mb-8" data-purpose="match-data-columns">
<!-- Column 1: Team 1 -->
<div class="flex flex-col items-center gap-1 flex-1">
<div class="w-14 h-14 bg-surface-container rounded-full flex items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-primary text-2xl">sports_cricket</span>
</div>
<span class="text-sm font-semibold text-on-surface">Titans XI</span>
</div>
<!-- Column 2: Match Info -->
<div class="flex flex-col items-center flex-1">
<div class="text-2xl font-bold text-on-surface leading-tight">142/4</div>
<div class="text-[12px] text-on-surface-variant">15.2 Overs</div>
<div class="text-sm font-bold text-primary mt-1">vs</div>
</div>
<!-- Column 3: Team 2 -->
<div class="flex flex-col items-center gap-1 flex-1">
<div class="w-14 h-14 bg-surface-container rounded-full flex items-center justify-center border border-surface-variant">
<span class="material-symbols-outlined text-secondary text-2xl">local_fire_department</span>
</div>
<span class="text-sm font-semibold text-on-surface">Lions CC</span>
</div>
</div>
<!-- Divider -->
<div class="h-px bg-surface-variant w-full mb-4"></div>
<!-- Match Footer -->
<div class="flex justify-between items-center" data-purpose="match-footer">
<div class="text-on-surface-variant italic text-sm" data-purpose="match-result">
    Titans XI need 34 runs in 28 balls
  </div>
<a class="text-primary font-semibold text-sm flex items-center gap-1 hover:underline" href="#">
    Schedule
    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</a>
</div>
</section>
<!-- END: LiveMatchCard -->
</main>
<!-- END: LiveMatchFocusScreen -->
</body></html>
