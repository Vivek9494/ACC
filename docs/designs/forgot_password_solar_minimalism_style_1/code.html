<style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .input-focus-ring:focus {
            box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.2);
            outline: none;
        }
        /* Solar Minimalism: Remove all borders */
        input, button, div, a, span {
            border: none !important;
        }
    </style>

<body class="min-h-screen text-on-surface font-body-md bg-background">
<!-- Top Navigation Header -->
<header class="fixed top-0 left-0 right-0 z-50 h-16 flex items-center px-margin-mobile mt-5">
<div class="flex items-center gap-4 w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-surface-container-high transition-colors active:scale-95 duration-200 bg-transparent" onclick="window.history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Forgot Password</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="pt-24 px-margin-mobile flex flex-col items-center justify-center min-h-[80vh] max-w-lg mx-auto">
<!-- Form Section -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-8 shadow-xl shadow-surface-variant/20">
<form class="space-y-8" id="forgot-password-form">
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant" for="mobile">Enter Mobile Number to get OTP</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-bold">+91</span>
<input class="w-full pl-14 pr-4 py-4 bg-surface-container-low rounded-xl text-on-surface font-body-md input-focus-ring transition-all placeholder:text-on-surface-variant/50 border-0" id="mobile" name="mobile" placeholder="00000 00000" required="" type="tel">
</div>
</div>
<button class="w-full py-4 bg-primary hover:opacity-90 text-on-primary font-headline-md rounded-xl flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-primary/30 border-0" type="submit">
<span>Send OTP</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer / Help Link -->
<div class="mt-8 text-center space-y-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Remember your password? 
                <a class="text-primary font-label-md hover:underline bg-transparent" href="#">Login here</a>
</p>
</div>
</main>
<script>
        // Simple micro-interaction for the form
        document.getElementById('forgot-password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span> <span>Sending...</span>';
            
            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined text-xl">check_circle</span> <span>OTP Sent</span>';
                const originalBg = btn.classList.contains('bg-primary') ? 'bg-primary' : 'bg-primary-container';
                btn.classList.replace(originalBg, 'bg-tertiary');
                btn.classList.remove('shadow-primary/30', 'shadow-primary-container/30');
                btn.classList.add('shadow-tertiary/30');
                
                setTimeout(() => {
                    alert('OTP has been sent to your mobile number.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-tertiary', originalBg);
                    btn.classList.remove('shadow-tertiary/30');
                    btn.classList.add('shadow-primary/30');
                }, 1500);
            }, 2000);
        });
    </script>
</body></html>
