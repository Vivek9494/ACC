<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASC Live Score Strip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" aria-live="polite">
      <div id="strip-wrap" class="strip-wrap" hidden>
        <div id="strip" class="strip">
          <div class="logo">
            <div class="logo-tile">
              <span id="bat-initials" class="logo-initials">?</span>
              <img id="bat-logo" class="logo-img" alt="" hidden />
            </div>
          </div>

          <div class="batters">
            <div id="batter-0" class="batter">
              <span class="arrow" aria-hidden="true">▸</span>
              <span id="batter-0-name" class="name">—</span>
              <span id="batter-0-runs" class="runs">0</span>
              <span id="batter-0-balls" class="balls">0</span>
            </div>
            <div id="batter-1" class="batter">
              <span class="arrow" aria-hidden="true">▸</span>
              <span id="batter-1-name" class="name">—</span>
              <span id="batter-1-runs" class="runs">0</span>
              <span id="batter-1-balls" class="balls">0</span>
            </div>
          </div>

          <div class="marquee">
            <div class="marquee-top">
              <span id="score-line" class="pill pill-score">0-0</span>
              <span id="power-pill" class="pill pill-power" title="Powerplay" hidden>P</span>
              <span id="overs-line" class="pill pill-over">0.0</span>
            </div>
            <div id="crr-row" class="crr-row">
              <span id="run-rate" class="run-rate">CRR 0.00</span>
              <span id="crr-sep" class="crr-sep" hidden>|</span>
              <span id="overs-rem" class="overs-rem" hidden></span>
            </div>
            <p id="subtitle" class="marquee-sub" hidden></p>
          </div>

          <div class="bowler">
            <div class="bowler-top">
              <span id="bowler-name" class="bowler-name">—</span>
              <span id="bowler-figs" class="bowler-figs"></span>
              <span id="bowler-overs" class="bowler-overs"></span>
            </div>
            <div id="over-tracker" class="tracker" aria-label="This over"></div>
          </div>

          <div class="logo">
            <div class="logo-tile">
              <span id="bowl-initials" class="logo-initials">?</span>
              <img id="bowl-logo" class="logo-img" alt="" hidden />
            </div>
          </div>
        </div>
        <div id="conn" class="conn" hidden>Reconnecting…</div>
      </div>

      <!-- Replaces the score strip while Bowler Career Stats is on air -->
      <div id="career-wrap" class="career-wrap" hidden>
        <div class="career-card">
          <div class="career-name-band">
            <p id="bc-name" class="career-name" aria-label="Bowler name">
              <span id="bc-name-initial" class="career-name-initial"></span><span
                id="bc-name-surname"
                class="career-name-surname"
                >—</span
              >
            </p>
          </div>
          <div class="career-stats" role="group" aria-label="Career bowling stats">
            <div class="career-stat">
              <span id="bc-matches" class="career-value">—</span>
              <span class="career-label">Matches</span>
            </div>
            <div class="career-stat">
              <span id="bc-wickets" class="career-value">—</span>
              <span class="career-label">Wickets</span>
            </div>
            <div class="career-stat">
              <span id="bc-avg" class="career-value">—</span>
              <span class="career-label">Average</span>
            </div>
            <div class="career-stat">
              <span id="bc-econ" class="career-value">—</span>
              <span class="career-label">Economy</span>
            </div>
            <div class="career-stat">
              <span id="bc-best" class="career-value">—</span>
              <span class="career-label">Best</span>
            </div>
          </div>
        </div>
      </div>

      <div id="idle" class="idle" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
