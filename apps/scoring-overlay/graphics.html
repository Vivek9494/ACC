<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASC Graphics Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="stage" class="stage" aria-live="polite">
      <!-- Partnership -->
      <div id="g-partnership" class="graphic panel panel-wide" hidden>
        <div class="panel-accent"></div>
        <div class="panel-body">
          <p class="eyebrow">Partnership</p>
          <p id="ps-total" class="hero-stat">0 (0)</p>
          <div class="pair-row">
            <div class="pair-batter">
              <p id="ps-a-name" class="name">—</p>
              <p id="ps-a-runs" class="sub">0</p>
            </div>
            <div class="pair-sep">&</div>
            <div class="pair-batter">
              <p id="ps-b-name" class="name">—</p>
              <p id="ps-b-runs" class="sub">0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Fall of wicket -->
      <div id="g-fow" class="graphic panel panel-wide" hidden>
        <div class="panel-accent"></div>
        <div class="panel-body">
          <p id="fow-headline" class="eyebrow">Wicket</p>
          <p id="fow-name" class="hero-name">—</p>
          <p id="fow-dismissal" class="sub dismissal">—</p>
          <p id="fow-detail" class="meta">—</p>
        </div>
      </div>

      <!-- Batsman card -->
      <div id="g-batsman" class="graphic panel panel-card" hidden>
        <div class="panel-accent"></div>
        <div class="card-layout">
          <div id="bat-photo" class="avatar" aria-hidden="true">
            <span id="bat-initials" class="avatar-initials">?</span>
            <img id="bat-img" alt="" hidden />
          </div>
          <div class="card-copy">
            <p class="eyebrow">Batsman</p>
            <p id="bat-name" class="hero-name">—</p>
            <p id="bat-match" class="hero-stat">0 (0)</p>
            <div class="stat-grid">
              <div>
                <span class="stat-label">Avg</span>
                <span id="bat-avg" class="stat-value">—</span>
              </div>
              <div>
                <span class="stat-label">SR</span>
                <span id="bat-sr" class="stat-value">—</span>
              </div>
              <div>
                <span class="stat-label">HS</span>
                <span id="bat-hs" class="stat-value">—</span>
              </div>
              <div>
                <span class="stat-label">Mat</span>
                <span id="bat-mat" class="stat-value">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Batsman career stats (full-screen profile) -->
      <div id="g-batsman-career" class="graphic panel panel-batsman-career" hidden>
        <div class="panel-accent"></div>
        <div class="bc-career-layout">
          <div class="bc-career-photo" aria-hidden="true">
            <span id="bc-career-initials" class="bc-career-initials">?</span>
            <img id="bc-career-img" class="bc-career-img" alt="" hidden />
          </div>
          <div class="bc-career-copy">
            <p id="bc-career-format" class="bc-career-format">—</p>
            <p id="bc-career-name" class="bc-career-name">
              <span id="bc-career-given" class="bc-career-given"></span
              ><span id="bc-career-family" class="bc-career-family">—</span>
            </p>
            <div class="bc-career-rows" role="table" aria-label="Batting career stats">
              <div class="bc-career-row" role="row">
                <span class="bc-career-label">Innings</span>
                <span id="bc-career-innings" class="bc-career-value">—</span>
              </div>
              <div class="bc-career-row" role="row">
                <span class="bc-career-label">Runs</span>
                <span id="bc-career-runs" class="bc-career-value">—</span>
              </div>
              <div class="bc-career-row" role="row">
                <span class="bc-career-label">Average</span>
                <span id="bc-career-avg" class="bc-career-value">—</span>
              </div>
              <div class="bc-career-row" role="row">
                <span class="bc-career-label">Strike Rate</span>
                <span id="bc-career-sr" class="bc-career-value">—</span>
              </div>
              <div class="bc-career-row" role="row">
                <span class="bc-career-label">30s</span>
                <span id="bc-career-thirties" class="bc-career-value">—</span>
              </div>
              <div class="bc-career-row" role="row">
                <span class="bc-career-label">50s</span>
                <span id="bc-career-fifties" class="bc-career-value">—</span>
              </div>
            </div>
            <div class="bc-career-hs">
              <p class="bc-career-hs-label">Highest Score</p>
              <p id="bc-career-hs" class="bc-career-hs-value">—</p>
              <p id="bc-career-hs-meta" class="bc-career-hs-meta" hidden></p>
            </div>
          </div>
        </div>
      </div>

      <!-- Bowler card -->
      <div id="g-bowler" class="graphic panel panel-card" hidden>
        <div class="panel-accent"></div>
        <div class="card-layout">
          <div id="bowl-photo" class="avatar" aria-hidden="true">
            <span id="bowl-initials" class="avatar-initials">?</span>
            <img id="bowl-img" alt="" hidden />
          </div>
          <div class="card-copy">
            <p class="eyebrow">Bowler</p>
            <p id="bowl-name" class="hero-name">—</p>
            <p id="bowl-match" class="hero-stat">0-0-0</p>
            <div class="stat-grid">
              <div>
                <span class="stat-label">Wkts</span>
                <span id="bowl-wkts" class="stat-value">—</span>
              </div>
              <div>
                <span class="stat-label">Best</span>
                <span id="bowl-best" class="stat-value">—</span>
              </div>
              <div>
                <span class="stat-label">Mat</span>
                <span id="bowl-mat" class="stat-value">—</span>
              </div>
              <div>
                <span class="stat-label">Runs</span>
                <span id="bowl-runs" class="stat-value">—</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Innings break -->
      <div id="g-innings" class="graphic panel panel-wide" hidden>
        <div class="panel-accent"></div>
        <div class="panel-body">
          <p class="eyebrow">Innings break</p>
          <div class="innings-rows">
            <div class="innings-row">
              <p id="inn1-team" class="name">—</p>
              <p id="inn1-score" class="hero-stat compact">—</p>
            </div>
            <div class="innings-row">
              <p id="inn2-team" class="name">—</p>
              <p id="inn2-score" class="hero-stat compact">—</p>
            </div>
          </div>
          <p id="inn-target" class="meta target-line" hidden></p>
        </div>
      </div>

      <!-- Phase A HELLO (kept for regression) -->
      <div id="g-hello" class="graphic hello" hidden>
        <div class="hello-inner">HELLO</div>
      </div>

      <div id="status" class="status" hidden></div>
    </div>
    <script type="module" src="/src/graphics-main.ts"></script>
  </body>
</html>
